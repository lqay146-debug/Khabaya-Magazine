<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="اكتشف أحدث مقالات مجلة خبايا في التقنية والصحة والمال والتعليم والثقافة والمعرفة.">
  <title>جميع المقالات | خَبايا</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background:#f8f6f0; color:#202b3b; font-family:'IBM Plex Sans Arabic',sans-serif; }
    .articles-wrap { max-width:1100px; margin:35px auto; padding:0 18px; }
    .articles-heading { margin-bottom:25px; }
    .articles-heading h1 { font-size:32px; margin-bottom:8px; }
    .articles-heading p { color:#697386; }
    .articles-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
    .article-card { background:white; border-radius:13px; overflow:hidden; box-shadow:0 4px 18px #1723380d; }
    .article-card img { width:100%; height:190px; object-fit:cover; display:block; }
    .article-card-content { padding:18px; }
    .article-card h2 { font-size:20px; margin:8px 0; line-height:1.6; }
    .article-card p { color:#687386; line-height:1.9; }
    .article-card a { color:#9a7337; text-decoration:none; font-weight:700; }
    .empty { background:white; border-radius:12px; padding:35px 20px; text-align:center; color:#687386; }
    .back { display:inline-block; margin-bottom:20px; color:#9a7337; text-decoration:none; }
  </style>
</head>
<body>
  <main class="articles-wrap">
    <a class="back" href="index.html">← العودة للرئيسية</a>

    <header class="articles-heading">
      <h1>مقالات خَبايا</h1>
      <p>مساحة للمعرفة والاكتشاف والأفكار الجديدة.</p>
    </header>

    <section id="articlesGrid" class="articles-grid">
      <div class="empty">
        <h2>قريباً في خَبايا</h2>
        <p>ستظهر هنا المقالات التي تنشرها في المجلة.</p>
      </div>
    </section>
  </main>
</body>
</html>
